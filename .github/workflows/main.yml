name: Build iOS IPA (PAKIN EPIC BUILD20)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode version
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Auto Reconstruct Xcode Project & Folders
        run: |
          echo "=== 1. ลบไฟล์ซ้ำที่มีวงเล็บ (1), (2), (15) ทั้งหมด ==="
          find . -maxdepth 2 -name "* (*)*" -exec rm -f {} + 2>/dev/null || true

          echo "=== 2. สร้างโฟลเดอร์ PAKIN_EPIC.xcodeproj อัตโนมัติ ==="
          mkdir -p PAKIN_EPIC.xcodeproj
          # หากมี project.pbxproj อยู่ที่ root ให้นำเข้าไปไว้ในโฟลเดอร์ทันที
          if [ -f "project.pbxproj" ]; then
            cp -f project.pbxproj PAKIN_EPIC.xcodeproj/
          fi
          # ลบ Info.plist ออกจาก Resources ของ xcode เพื่อป้องกัน warning ซ้ำซ้อน
          sed -i '' '/Info.plist in Resources/d' PAKIN_EPIC.xcodeproj/project.pbxproj 2>/dev/null || true

          echo "=== 3. จัดโครงสร้างโฟลเดอร์ไฟล์ Swift ให้ Xcode ==="
          # App
          mkdir -p App
          cp -f PAKIN_EPICApp.swift App/ 2>/dev/null || true
          cp -f ContentView.swift App/ 2>/dev/null || true

          # Core
          mkdir -p Core
          cp -f AppConfig.swift Core/ 2>/dev/null || true
          cp -f AppLog.swift Core/ 2>/dev/null || true
          cp -f DeviceUtility.swift Core/ 2>/dev/null || true
          cp -f HTVLicenseManager.swift Core/ 2>/dev/null || true
          cp -f HTVLicenseAPI.swift Core/ 2>/dev/null || true
          cp -f HTVLicenseError.swift Core/ 2>/dev/null || true
          cp -f CloudConfigManager.swift Core/ 2>/dev/null || true

          # Models
          mkdir -p Models
          cp -f AppState.swift Models/ 2>/dev/null || true
          cp -f FreeFireModels.swift Models/ 2>/dev/null || true
          cp -f LicenseModels.swift Models/ 2>/dev/null || true
          cp -f PatchModels.swift Models/ 2>/dev/null || true
          cp -f RepositoryModels.swift Models/ 2>/dev/null || true
          cp -f WallpaperModels.swift Models/ 2>/dev/null || true

          # Features & Clock
          mkdir -p Features/Clock
          cp -f ClockModels.swift Features/Clock/ 2>/dev/null || true
          cp -f ClockRootView.swift Features/Clock/ 2>/dev/null || true
          cp -f WorldClockView.swift Features/Clock/ 2>/dev/null || true
          cp -f AlarmsView.swift Features/Clock/ 2>/dev/null || true
          cp -f StopwatchView.swift Features/Clock/ 2>/dev/null || true
          cp -f TimerCountdownView.swift Features/Clock/ 2>/dev/null || true

          cp -f FreeFireHubView.swift Features/ 2>/dev/null || true
          cp -f HTVLicenseGateView.swift Features/ 2>/dev/null || true
          cp -f SettingsView.swift Features/ 2>/dev/null || true
          cp -f OnboardingView.swift Features/ 2>/dev/null || true
          cp -f RepositoryHomeView.swift Features/ 2>/dev/null || true
          cp -f RepositorySourcesView.swift Features/ 2>/dev/null || true
          cp -f WallpapersView.swift Features/ 2>/dev/null || true
          cp -f CleanerView.swift Features/ 2>/dev/null || true
          cp -f AppDataBrowserView.swift Features/ 2>/dev/null || true
          cp -f GestaltEditorView.swift Features/ 2>/dev/null || true
          cp -f PatchProjectsView.swift Features/ 2>/dev/null || true

          # Components
          mkdir -p Components
          cp -f HTVScreenBackground.swift Components/ 2>/dev/null || true
          cp -f HTVSectionHeader.swift Components/ 2>/dev/null || true
          cp -f HTVComponents.swift Components/ 2>/dev/null || true

          # Resources
          mkdir -p Resources/Mods
          mkdir -p Resources/Assets.xcassets/AppIcon.appiconset
          cp -f Info.plist Resources/ 2>/dev/null || true
          cp -f *.3105 Resources/Mods/ 2>/dev/null || true
          cp -f AppIcon*.png Resources/Assets.xcassets/AppIcon.appiconset/ 2>/dev/null || true
          cp -f Contents.json Resources/Assets.xcassets/AppIcon.appiconset/ 2>/dev/null || true

          echo "=== 4. แก้ไขโค้ด Swift อัตโนมัติ ==="
          find . -type f -name "*.swift" -exec sed -i '' 's/licenseManager\.revoke()/licenseManager.signOutLicense()/g' {} + 2>/dev/null || true

          python3 -c '
          import glob
          for path in glob.glob("**/*HTVLicenseManager.swift", recursive=True):
              with open(path, "r", encoding="utf-8") as f:
                  content = f.read()
              if "func revoke()" not in content:
                  content = content.replace(
                      "public func signOutLicense() {",
                      "public func revoke() {\n        signOutLicense()\n    }\n\n    public func signOutLicense() {"
                  )
              with open(path, "w", encoding="utf-8") as f:
                  f.write(content)
          ' 2>/dev/null || true

      - name: Build Xcode Archive
        run: |
          xcodebuild -project PAKIN_EPIC.xcodeproj \
            -scheme PAKIN_EPIC \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/PAKIN_EPIC.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            archive

      - name: Package Unsigned IPA (PAKIN EPIC BUILD20)
        run: |
          mkdir -p build/Payload
          cp -r build/PAKIN_EPIC.xcarchive/Products/Applications/PAKIN_EPIC.app build/Payload/
          
          # ผนวกไฟล์ 3105 และ DNS profile
          mkdir -p build/Payload/PAKIN_EPIC.app/Mods
          cp Resources/Mods/*.3105 build/Payload/PAKIN_EPIC.app/Mods/ 2>/dev/null || true
          cp Resources/Mods/*.3105 build/Payload/PAKIN_EPIC.app/ 2>/dev/null || true
          cp *.3105 build/Payload/PAKIN_EPIC.app/Mods/ 2>/dev/null || true
          cp pakin_antiban_dns.mobileconfig build/Payload/PAKIN_EPIC.app/ 2>/dev/null || true
          
          # ผนวก CoreAssets Bundle
          mkdir -p build/Payload/PAKIN_EPIC.app/CoreAssets.bundle
          if [ -f "Resources/CoreAssets.bundle/AssetsData.bin" ]; then
            cp "Resources/CoreAssets.bundle/AssetsData.bin" "build/Payload/PAKIN_EPIC.app/CoreAssets.bundle/"
          else
            dd if=/dev/urandom of=build/Payload/PAKIN_EPIC.app/CoreAssets.bundle/AssetsData.bin bs=1048576 count=14 2>/dev/null || true
          fi
          
          cd build
          zip -r PAKIN-EPIC-BUILD20-unsigned.ipa Payload
          cp PAKIN-EPIC-BUILD20-unsigned.ipa PAKIN_EPIC_CLOCK.ipa
          cd ..
          
          echo "Generated IPA Files:"
          ls -lh build/*.ipa

      - name: Upload IPA Artifact for Download
        uses: actions/upload-artifact@v4
        with:
          name: PAKIN-EPIC-BUILD20-unsigned
          path: build/*.ipa
          retention-days: 14
