name: Build iOS IPA (PAKIN EPIC BUILD20)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode version
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Fix Xcode project settings and file paths
        run: |
          # 1. ลบ Info.plist ออกจาก Resources ของ xcode เพื่อป้องกัน duplicate warning
          sed -i '' '/Info.plist in Resources/d' PAKIN_EPIC.xcodeproj/project.pbxproj 2>/dev/null || true
          
          # 2. แก้ไข revoke() ให้เป็น signOutLicense() อัตโนมัติ
          find . -type f -name "*.swift" -exec sed -i '' 's/licenseManager\.revoke()/licenseManager.signOutLicense()/g' {} + 2>/dev/null || true
          
          # 3. จัดการโครงสร้างไฟล์ซับโฟลเดอร์ของ Core และ Models
          cp Core/*/*.swift Core/ 2>/dev/null || true
          cp Models/*/*.swift Models/ 2>/dev/null || true
          
          # ตรวจสอบและคงโฟลเดอร์ Features/Clock สำหรับหน้านาฬิกาพรางตัว
          mkdir -p Features/Clock
          cp -n Features/*Clock*.swift Features/Clock/ 2>/dev/null || true

          # 4. ตรวจสอบ method revoke() ใน HTVLicenseManager
          python3 -c '
          import glob
          for path in glob.glob("**/*HTVLicenseManager.swift", recursive=True):
              with open(path, "r", encoding="utf-8") as f:
                  content = f.read()
              if "func revoke()" not in content:
                  content = content.replace(
                      "public func signOutLicense() {",
                      "public func revoke() {\n        signOutLicense()\n    }\n\n    public func signOutLicense() {"
                  )
              with open(path, "w", encoding="utf-8") as f:
                  f.write(content)
          ' 2>/dev/null || true

      - name: Build Xcode Archive
        run: |
          xcodebuild -project PAKIN_EPIC.xcodeproj \
            -scheme PAKIN_EPIC \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/PAKIN_EPIC.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            archive

      - name: Package Unsigned IPA (PAKIN EPIC BUILD20)
        run: |
          mkdir -p build/Payload
          cp -r build/PAKIN_EPIC.xcarchive/Products/Applications/PAKIN_EPIC.app build/Payload/
          
          # ผนวกไฟล์ 3105 และ DNS profile เข้า Bundle
          mkdir -p build/Payload/PAKIN_EPIC.app/Mods
          cp Resources/Mods/*.3105 build/Payload/PAKIN_EPIC.app/Mods/ 2>/dev/null || true
          cp Resources/Mods/*.3105 build/Payload/PAKIN_EPIC.app/ 2>/dev/null || true
          cp pakin_antiban_dns.mobileconfig build/Payload/PAKIN_EPIC.app/ 2>/dev/null || true
          
          # สร้าง AssetsData.bin สำหรับ Runner
          mkdir -p build/Payload/PAKIN_EPIC.app/CoreAssets.bundle
          if [ -f "Resources/CoreAssets.bundle/AssetsData.bin" ]; then
            cp "Resources/CoreAssets.bundle/AssetsData.bin" "build/Payload/PAKIN_EPIC.app/CoreAssets.bundle/"
          else
            dd if=/dev/urandom of=build/Payload/PAKIN_EPIC.app/CoreAssets.bundle/AssetsData.bin bs=1048576 count=14 2>/dev/null || true
          fi
          
          cd build
          zip -r PAKIN-EPIC-BUILD20-unsigned.ipa Payload
          cp PAKIN-EPIC-BUILD20-unsigned.ipa PAKIN_EPIC_CLOCK.ipa
          cd ..
          
          echo "Built IPA Files:"
          ls -lh build/*.ipa

      - name: Upload IPA Artifact for Download
        uses: actions/upload-artifact@v4
        with:
          name: PAKIN-EPIC-BUILD20-unsigned
          path: build/*.ipa
          retention-days: 14
