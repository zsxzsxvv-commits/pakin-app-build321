name: Build iOS IPA (PAKIN EPIC BUILD20)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode version
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Reconstruct Xcode Project & Clean Duplicates
        run: |
          echo "=== 1. Cleaning duplicate files with (1), (2), etc. ==="
          find . -maxdepth 2 -name "* (*)*" -exec rm -f {} + 2>/dev/null || true
          
          echo "=== 2. Reconstructing PAKIN_EPIC.xcodeproj ==="
          mkdir -p PAKIN_EPIC.xcodeproj
          if [ -f "project.pbxproj" ]; then
            cp project.pbxproj PAKIN_EPIC.xcodeproj/
          fi
          # ลบ Info.plist ออกจาก Resources ของ xcode เพื่อป้องกัน duplicate warning
          sed -i '' '/Info.plist in Resources/d' PAKIN_EPIC.xcodeproj/project.pbxproj 2>/dev/null || true

          echo "=== 3. Distributing files to expected Xcode directories ==="
          # Folder: App
          mkdir -p App
          cp PAKIN_EPICApp.swift App/ 2>/dev/null || true
          cp ContentView.swift App/ 2>/dev/null || true

          # Folder: Core
          mkdir -p Core
          cp AppConfig.swift Core/ 2>/dev/null || true
          cp AppLog.swift Core/ 2>/dev/null || true
          cp DeviceUtility.swift Core/ 2>/dev/null || true
          cp HTVLicenseManager.swift Core/ 2>/dev/null || true
          cp HTVLicenseAPI.swift Core/ 2>/dev/null || true
          cp HTVLicenseError.swift Core/ 2>/dev/null || true
          cp CloudConfigManager.swift Core/ 2>/dev/null || true

          # Folder: Models
          mkdir -p Models
          cp AppState.swift Models/ 2>/dev/null || true
          cp FreeFireModels.swift Models/ 2>/dev/null || true
          cp LicenseModels.swift Models/ 2>/dev/null || true
          cp PatchModels.swift Models/ 2>/dev/null || true
          cp RepositoryModels.swift Models/ 2>/dev/null || true
          cp WallpaperModels.swift Models/ 2>/dev/null || true

          # Folder: Features & Clock
          mkdir -p Features/Clock
          cp ClockModels.swift Features/Clock/ 2>/dev/null || true
          cp ClockRootView.swift Features/Clock/ 2>/dev/null || true
          cp WorldClockView.swift Features/Clock/ 2>/dev/null || true
          cp AlarmsView.swift Features/Clock/ 2>/dev/null || true
          cp StopwatchView.swift Features/Clock/ 2>/dev/null || true
          cp TimerCountdownView.swift Features/Clock/ 2>/dev/null || true

          cp FreeFireHubView.swift Features/ 2>/dev/null || true
          cp HTVLicenseGateView.swift Features/ 2>/dev/null || true
          cp SettingsView.swift Features/ 2>/dev/null || true
          cp OnboardingView.swift Features/ 2>/dev/null || true
          cp RepositoryHomeView.swift Features/ 2>/dev/null || true
          cp RepositorySourcesView.swift Features/ 2>/dev/null || true
          cp WallpapersView.swift Features/ 2>/dev/null || true
          cp CleanerView.swift Features/ 2>/dev/null || true
          cp AppDataBrowserView.swift Features/ 2>/dev/null || true
          cp GestaltEditorView.swift Features/ 2>/dev/null || true
          cp PatchProjectsView.swift Features/ 2>/dev/null || true

          # Folder: Components
          mkdir -p Components
          cp HTVScreenBackground.swift Components/ 2>/dev/null || true
          cp HTVSectionHeader.swift Components/ 2>/dev/null || true
          cp HTVComponents.swift Components/ 2>/dev/null || true

          # Folder: Resources
          mkdir -p Resources/Mods
          mkdir -p Resources/Assets.xcassets/AppIcon.appiconset
          cp Info.plist Resources/ 2>/dev/null || true
          cp *.3105 Resources/Mods/ 2>/dev/null || true
          cp AppIcon*.png Resources/Assets.xcassets/AppIcon.appiconset/ 2>/dev/null || true
          cp Contents.json Resources/Assets.xcassets/AppIcon.appiconset/ 2>/dev/null || true

          echo "=== 4. Patching Swift source code fixes ==="
          find . -type f -name "*.swift" -exec sed -i '' 's/licenseManager\.revoke()/licenseManager.signOutLicense()/g' {} + 2>/dev/null || true

          python3 -c '
          import glob
          for path in glob.glob("**/*HTVLicenseManager.swift", recursive=True):
              with open(path, "r", encoding="utf-8") as f:
                  content = f.read()
              if "func revoke()" not in content:
                  content = content.replace(
                      "public func signOutLicense() {",
                      "public func revoke() {\n        signOutLicense()\n    }\n\n    public func signOutLicense() {"
                  )
              with open(path, "w", encoding="utf-8") as f:
                  f.write(content)
          ' 2>/dev/null || true

      - name: Build Xcode Archive
        run: |
          xcodebuild -project PAKIN_EPIC.xcodeproj \
            -scheme PAKIN_EPIC \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/PAKIN_EPIC.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            archive

      - name: Package Unsigned IPA (PAKIN EPIC BUILD20)
        run: |
          mkdir -p build/Payload
          cp -r build/PAKIN_EPIC.xcarchive/Products/Applications/PAKIN_EPIC.app build/Payload/
          
          # ผนวกไฟล์ 3105 และ DNS profile
          mkdir -p build/Payload/PAKIN_EPIC.app/Mods
          cp Resources/Mods/*.3105 build/Payload/PAKIN_EPIC.app/Mods/ 2>/dev/null || true
          cp Resources/Mods/*.3105 build/Payload/PAKIN_EPIC.app/ 2>/dev/null || true
          cp *.3105 build/Payload/PAKIN_EPIC.app/Mods/ 2>/dev/null || true
          cp pakin_antiban_dns.mobileconfig build/Payload/PAKIN_EPIC.app/ 2>/dev/null || true
          
          # ผนวก CoreAssets Bundle
          mkdir -p build/Payload/PAKIN_EPIC.app/CoreAssets.bundle
          if [ -f "Resources/CoreAssets.bundle/AssetsData.bin" ]; then
            cp "Resources/CoreAssets.bundle/AssetsData.bin" "build/Payload/PAKIN_EPIC.app/CoreAssets.bundle/"
          else
            dd if=/dev/urandom of=build/Payload/PAKIN_EPIC.app/CoreAssets.bundle/AssetsData.bin bs=1048576 count=14 2>/dev/null || true
          fi
          
          cd build
          zip -r PAKIN-EPIC-BUILD20-unsigned.ipa Payload
          cp PAKIN-EPIC-BUILD20-unsigned.ipa PAKIN_EPIC_CLOCK.ipa
          cd ..
          
          echo "Generated IPA Files:"
          ls -lh build/*.ipa

      - name: Upload IPA Artifact for Download
        uses: actions/upload-artifact@v4
        with:
          name: PAKIN-EPIC-BUILD20-unsigned
          path: build/*.ipa
          retention-days: 14
